<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immortal Path</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Georgia, serif;
    background: radial-gradient(circle at top, #20243a, #080910 70%);
    color: #eee;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h1 {
    font-size: 34px;
    letter-spacing: 3px;
}

.title p {
    color: #aaa;
    margin-top: 8px;
    font-size: 14px;
}

.card {
    background: rgba(20, 22, 35, 0.95);
    border: 1px solid #393d58;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.character {
    text-align: center;
}

.avatar {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: #292d46;
    border: 2px solid #777da5;
}

.name {
    font-size: 22px;
    margin-top: 12px;
}

.realm {
    color: #b8a5ff;
    margin-top: 5px;
}

.progress-container {
    margin-top: 18px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 7px;
}

.progress {
    height: 12px;
    background: #0c0d14;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7057d9, #bda9ff);
    transition: width 0.4s;
}

.buttons {
    display: grid;
    gap: 12px;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: #343952;
}

button:active {
    transform: scale(0.98);
}

.cultivate {
    background: linear-gradient(135deg, #5541a8, #8066e8);
}

.breakthrough {
    background: linear-gradient(135deg, #8c5b25, #c68a3d);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    text-align: center;
    background: #11131e;
    border-radius: 12px;
    padding: 13px 5px;
}

.stat-value {
    font-size: 20px;
    font-weight: bold;
}

.stat-label {
    color: #999;
    font-size: 11px;
    margin-top: 5px;
}

.log {
    max-height: 180px;
    overflow-y: auto;
}

.log-entry {
    border-bottom: 1px solid #292c3d;
    padding: 9px 0;
    font-size: 13px;
    color: #bbb;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 11px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>IMMORTAL PATH</h1>
        <p>Walk the path of cultivation.</p>
    </div>

    <div class="card character">

        <div class="avatar">☯</div>

        <div class="name">Nameless Cultivator</div>

        <div class="realm" id="realm">
            Qi Condensation — Early Stage
        </div>

        <div class="progress-container">

            <div class="progress-text">
                <span>Qi</span>
                <span id="qiText">0 / 100</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="qiBar"></div>
            </div>

        </div>

    </div>

    <div class="card">

        <div class="buttons">

            <button class="cultivate" onclick="cultivate()">
                ⚡ Cultivate
            </button>

            <button class="breakthrough" onclick="breakthrough()">
                ☯ Attempt Breakthrough
            </button>

        </div>

    </div>

    <div class="card">

        <h3>Attributes</h3>

        <div class="stats">

            <div class="stat">
                <div class="stat-value" id="power">10</div>
                <div class="stat-label">POWER</div>
            </div>

            <div class="stat">
                <div class="stat-value" id="cultivation">0</div>
                <div class="stat-label">CULTIVATION</div>
            </div>

            <div class="stat">
                <div class="stat-value" id="breakthroughs">0</div>
                <div class="stat-label">BREAKTHROUGHS</div>
            </div>

        </div>

    </div>

    <div class="card">

        <h3>Cultivation Log</h3>

        <div class="log" id="log">
            <div class="log-entry">
                Your journey has begun...
            </div>
        </div>

    </div>

    <div class="footer">
        Immortal Path • Prototype
    </div>

</div>

<script>

let qi = 0;
let maxQi = 100;
let power = 10;
let cultivation = 0;
let breakthroughs = 0;

let realmIndex = 0;

const realms = [
    "Qi Condensation — Early Stage",
    "Foundation Establishment",
    "Core Formation",
    "Nascent Soul",
    "Soul Formation",
    "Ascendant",
    "Immortal"
];

function cultivate() {

    let gain = Math.floor(Math.random() * 31) + 20;

    qi += gain;
    cultivation += gain;

    if (qi > maxQi) {
        qi = maxQi;
    }

    update();

    addLog(
        "You cultivated and gained " + gain + " Qi."
    );
}

function breakthrough() {

    if (realmIndex >= realms.length - 1) {

        addLog("You have reached the Immortal Realm.");

        return;
    }

    if (qi < maxQi) {

        addLog(
            "Your Qi is not sufficient for a breakthrough."
        );

        return;
    }

    let chance = Math.random();

    if (chance < 0.70) {

        realmIndex++;

        qi = 0;

        breakthroughs++;

        power += 25;

        maxQi += 100;

        addLog(
            "BREAKTHROUGH SUCCESSFUL! You entered " +
            realms[realmIndex] + "."
        );

    } else {

        qi = Math.floor(qi * 0.5);

        addLog(
            "Breakthrough failed. Your Qi was damaged."
        );
    }

    update();
}

function update() {

    document.getElementById("qiText").innerText =
        qi + " / " + maxQi;

    document.getElementById("qiBar").style.width =
        ((qi / maxQi) * 100) + "%";

    document.getElementById("realm").innerText =
        realms[realmIndex];

    document.getElementById("power").innerText =
        power;

    document.getElementById("cultivation").innerText =
        cultivation;

    document.getElementById("breakthroughs").innerText =
        breakthroughs;
}

function addLog(message) {

    const log = document.getElementById("log");

    const entry = document.createElement("div");

    entry.className = "log-entry";

    let time = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    entry.innerText =
        "[" + time + "] " + message;

    log.prepend(entry);
}

update();

</script>

</body>
</html>
