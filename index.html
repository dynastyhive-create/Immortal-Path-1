<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Immortal Path</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #18243d 0%, #080b13 45%, #030407 100%);
            color: white;
        }

        .app {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 20px 16px 30px;
        }

        .header {
            text-align: center;
            padding: 15px 0 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .header p {
            margin: 8px 0 0;
            color: #9fa9bd;
            font-size: 14px;
        }

        .card {
            background: rgba(15, 20, 34, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d4af37, #765d13);
            font-size: 28px;
        }

        .profile h2 {
            margin: 0;
            font-size: 20px;
        }

        .profile p {
            margin: 5px 0 0;
            color: #aeb7c9;
            font-size: 13px;
        }

        .realm {
            text-align: center;
        }

        .realm-title {
            color: #c9a94b;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .realm-name {
            font-size: 25px;
            font-weight: bold;
            margin: 8px 0;
        }

        .qi-text {
            display: flex;
            justify-content: space-between;
            color: #aeb7c9;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #252b39;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8b6b19, #f0d36b);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat {
            text-align: center;
            background: rgba(255,255,255,0.04);
            padding: 12px 5px;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }

        .stat-label {
            color: #8993a8;
            font-size: 11px;
            margin-top: 4px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .cultivate {
            background: linear-gradient(135deg, #b78b25, #e0bd58);
            color: #111;
        }

        .breakthrough {
            background: linear-gradient(135deg, #382c66, #6549b7);
        }

        button:active {
            transform: scale(0.98);
        }

        .log {
            color: #9fa9bd;
            font-size: 13px;
            line-height: 1.6;
            min-height: 22px;
        }

        .footer {
            text-align: center;
            color: #555f73;
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>IMMORTAL PATH</h1>
        <p>Walk the path of cultivation.</p>
    </div>

    <div class="card profile">
        <div class="avatar">☯</div>

        <div>
            <h2 id="playerName">Unnamed Cultivator</h2>
            <p>Seeker of the Immortal Dao</p>
        </div>
    </div>

    <div class="card realm">

        <div class="realm-title">Current Realm</div>

        <div class="realm-name" id="realmName">
            Qi Condensation
        </div>

        <div class="qi-text">
            <span>Qi Progress</span>
            <span id="qiText">0 / 100</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button class="cultivate" onclick="cultivate()">
            🧘 Cultivate
        </button>

        <button class="breakthrough" onclick="breakthrough()">
            ⚡ Attempt Breakthrough
        </button>

    </div>

    <div class="card">

        <div class="stats">

            <div class="stat">
                <div class="stat-value" id="power">1</div>
                <div class="stat-label">POWER</div>
            </div>

            <div class="stat">
                <div class="stat-value" id="cultivations">0</div>
                <div class="stat-label">CULTIVATIONS</div>
            </div>

            <div class="stat">
                <div class="stat-value" id="breakthroughs">0</div>
                <div class="stat-label">BREAKTHROUGHS</div>
            </div>

        </div>

    </div>

    <div class="card">

        <strong>📜 Dao Log</strong>

        <div class="log" id="log">
            Your journey begins...
        </div>

    </div>

    <div class="footer">
        Immortal Path • Cultivate Beyond Mortality
    </div>

</div>

<script>

    // Telegram Mini App
    const tg = window.Telegram.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    let qi = 0;
    let power = 1;
    let cultivations = 0;
    let breakthroughs = 0;

    const realms = [
        "Qi Condensation",
        "Foundation Establishment",
        "Core Formation",
        "Nascent Soul",
        "Soul Formation",
        "Spirit Severing",
        "Void Tribulant",
        "Ascendant",
        "Immortal"
    ];

    let realmIndex = 0;

    function cultivate() {

        const gain = Math.floor(Math.random() * 11) + 5;

        qi += gain;
        cultivations++;

        document.getElementById("log").innerText =
            "You circulate your Qi and gain +" + gain + " cultivation energy.";

        updateUI();

        if (qi >= 100) {
            qi = 100;

            document.getElementById("log").innerText =
                "Your cultivation has reached its current limit. Attempt a breakthrough.";
            
            updateUI();
        }
    }

    function breakthrough() {

        if (qi < 100) {

            document.getElementById("log").innerText =
                "Your foundation is not ready. Reach 100 Qi first.";

            return;
        }

        if (realmIndex >= realms.length - 1) {

            document.getElementById("log").innerText =
                "You have reached the peak of the Immortal Path.";

            return;
        }

        realmIndex++;

        qi = 0;

        power += 10;

        breakthroughs++;

        document.getElementById("log").innerText =
            "BREAKTHROUGH SUCCESSFUL! You entered " +
            realms[realmIndex] + ".";

        updateUI();
    }

    function updateUI() {

        document.getElementById("qiText").innerText =
            qi + " / 100";

        document.getElementById("progressBar").style.width =
            qi + "%";

        document.getElementById("realmName").innerText =
            realms[realmIndex];

        document.getElementById("power").innerText =
            power;

        document.getElementById("cultivations").innerText =
            cultivations;

        document.getElementById("breakthroughs").innerText =
            breakthroughs;
    }

    // Try to get the Telegram user's name
    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        const user = tg.initDataUnsafe.user;

        document.getElementById("playerName").innerText =
            user.first_name || "Cultivator";
    }

    updateUI();

</script>

</body>
</html>
